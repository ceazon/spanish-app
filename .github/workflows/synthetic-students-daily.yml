name: Synthetic Students Daily

on:
  schedule:
    - cron: "5 13 * * *"   # diego
    - cron: "35 20 * * *"  # maria
    - cron: "15 14 * * *"  # lucia
    - cron: "45 15 * * *"  # mateo
    - cron: "10 18 * * *"  # sofia
    - cron: "25 22 * * *"  # camila
  workflow_dispatch:
    inputs:
      persona:
        description: "Optional persona override (diego|maria|lucia|mateo|sofia|camila)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve persona
        id: persona
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.persona }}" ]]; then
            PERSONA="${{ github.event.inputs.persona }}"
          else
            case "${{ github.event.schedule }}" in
              "5 13 * * *") PERSONA="diego" ;;
              "35 20 * * *") PERSONA="maria" ;;
              "15 14 * * *") PERSONA="lucia" ;;
              "45 15 * * *") PERSONA="mateo" ;;
              "10 18 * * *") PERSONA="sofia" ;;
              "25 22 * * *") PERSONA="camila" ;;
              *) PERSONA="diego" ;;
            esac
          fi
          echo "persona=$PERSONA" >> "$GITHUB_OUTPUT"
          echo "Running persona: $PERSONA"

      - name: Run synthetic student
        env:
          STUDENT_PERSONA: ${{ steps.persona.outputs.persona }}
          STUDENT_AUTO_PUBLISH: "1"
          STUDENT_BASE_URL: https://chadlingo.com
        run: npm run student:run

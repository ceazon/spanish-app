name: Synthetic Advisor Daily

"on":
  schedule:
    - cron: "45 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advisor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate synthetic advisor report
        env:
          ADVISOR_WINDOW_DAYS: "3"
        run: npm run advisor:run

      - name: Upload advisor outputs artifact (review-first mode)
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-advisor-${{ github.run_id }}
          path: |
            advisor/reports
            advisor/prompts
          if-no-files-found: warn

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: chadmarson@hotmail.com
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$FROM_EMAIL" ]; then
            echo "RESEND_API_KEY or FROM_EMAIL is not set; skipping email send."
            exit 0
          fi

          DATE=$(date -u +%F)
          REPORT_PATH="advisor/reports/${DATE}.md"
          SUBJECT="Synthetic Advisor: Recommendations for ${DATE}"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Advisor report not found at $REPORT_PATH"
            exit 1
          fi

          HTML_BODY=$(printf '<h2>Synthetic Advisor - %s</h2><pre style="white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace">%s</pre>' "$DATE" "$(sed 's/"/\\"/g' "$REPORT_PATH")")

          jq -n \
            --arg from "$FROM_EMAIL" \
            --arg to "$TO_EMAIL" \
            --arg subject "$SUBJECT" \
            --arg html "$HTML_BODY" \
            '{from:$from,to:[$to],subject:$subject,html:$html}' > resend-payload.json

          curl -sS https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @resend-payload.json

name: Synthetic Student Daily

on:
  schedule:
    - cron: "15 13 * * *" # daily ~09:15 America/Toronto (DST may shift)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run synthetic student
        run: npm run student:run
        env:
          STUDENT_BASE_URL: https://chadlingo.com

      - name: Commit daily draft/report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/reports blog/drafts || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(agent): daily synthetic student report"
          git push
